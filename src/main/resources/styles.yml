schema-version: 1

# messages.yml では {beat} / {primary} / {success} / {warning} / {error} / {reset} として使用できます。
colors:
  brand: DARK_AQUA
  primary: AQUA
  success: GREEN
  warning: YELLOW
  error: RED

competition-name-colors:
  low-progress: RED
  caution: YELLOW
  active: AQUA
  advanced: LIGHT_PURPLE
  leader: GOLD
  complete: GREEN
  danger: RED
  eliminated: DARK_GRAY

highlight-tag-colors:
  all-clear: GOLD
  leader-change: GOLD
  leader-update: YELLOW
  goal: GREEN
  milestone: AQUA
  border: LIGHT_PURPLE
  personal-best: GREEN
  rank-change: GRAY
  elimination: RED

display-ticks:
  feedback: 60
  goal: 60

sounds:
  highlights:
    all-clear:
      name: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
    leader-change:
      name: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.2
    leader-update:
      name: BLOCK_NOTE_BLOCK_PLING
      volume: 0.9
      pitch: 1.4
    goal:
      name: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
    milestone:
      name: BLOCK_NOTE_BLOCK_PLING
      volume: 0.9
      pitch: 1.5
    border:
      name: ENTITY_PLAYER_LEVELUP
      volume: 0.9
      pitch: 1.0
    personal-best:
      name: BLOCK_NOTE_BLOCK_CHIME
      volume: 0.9
      pitch: 1.2
    rank-change-notification:
      name: BLOCK_NOTE_BLOCK_COW_BELL
      volume: 0.8
      pitch: 1.2
    elimination:
      name: minecraft:entity.dragon_fireball.explode
      volume: 0.7
      pitch: 0.7
  countdown:
    name: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.0
  high-spot:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.5
  competition-start:
    name: BLOCK_NOTE_BLOCK_BELL
    volume: 1.0
    pitch: 1.2
  high-practice-checkpoint:
    name: BLOCK_RESPAWN_ANCHOR_SET_SPAWN
    volume: 0.8
    pitch: 1.2
  high-practice-flight:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.2
  high-course:
    name: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2
  high-goal:
    name: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  ta-personal-best:
    name: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  ta-start:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.2
  ta-split:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.5
  ta-finished:
    name: BLOCK_NOTE_BLOCK_CHIME
    volume: 0.9
    pitch: 1.0
  player-visibility:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.0
  elimination:
    name: minecraft:entity.dragon_fireball.explode
    volume: 0.7
    pitch: 0.7
  time-limit-end:
    name: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.5
  endurance-progress:
    name: BLOCK_NOTE_BLOCK_PLING
    volume: 0.7
    pitch: 1.5
  endurance-zone:
    name: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  endurance-goal:
    name: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0

boss-bars:
  high:
    color: BLUE
    style: SOLID
  high-practice:
    color: GREEN
    style: SOLID
  high-prepare:
    color: YELLOW
    style: SOLID
  time-attack:
    color: BLUE
    style: SOLID
  endurance:
    color: GREEN
    style: SOLID

setup-visualization:
  display-ticks: 100
  interval-ticks: 5
  max-particles-per-tick: 200
  spacing: 1.0
  particles:
    spot: END_ROD
    progress: END_ROD
    goal: FLAME
    start: HAPPY_VILLAGER
